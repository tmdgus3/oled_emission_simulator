  <style>
    :root {
      --bg: #f6f7f4;
      --ink: #151515;
      --muted: #62645f;
      --line: #d9ddd2;
      --panel: #ffffff;
      --rice: #009a8d;
      --meat: #f05745;
      --soup: #4f9d69;
      --random: #222222;
      --gold: #f2c84b;
      --shadow: 0 18px 50px rgba(21, 21, 21, .13);
      color-scheme: light;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      letter-spacing: 0;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100%;
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(240, 87, 69, .10), transparent 34%),
        linear-gradient(315deg, rgba(0, 154, 141, .12), transparent 38%),
        var(--bg);
      -webkit-tap-highlight-color: transparent;
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: .7;
    }

    .app {
      width: min(100%, 720px);
      min-height: 100svh;
      margin: 0 auto;
      padding: max(18px, env(safe-area-inset-top)) 16px max(22px, env(safe-area-inset-bottom));
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 14px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--ink);
      border: 3px solid #fff;
      border-radius: 8px;
      box-shadow: 0 8px 20px rgba(21, 21, 21, .18);
      flex: 0 0 auto;
    }

    .brand-mark svg {
      width: 28px;
      height: 28px;
    }

    .title {
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: 1.35rem;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: .88rem;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .icon-button {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: rgba(255, 255, 255, .82);
      box-shadow: 0 8px 20px rgba(21, 21, 21, .07);
    }

    .icon-button svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
    }

    .machine {
      align-self: stretch;
      display: grid;
      grid-template-rows: minmax(390px, 1fr) auto;
      gap: 12px;
      border: 1px solid rgba(21, 21, 21, .08);
      border-radius: 8px;
      padding: 14px;
      background: rgba(255, 255, 255, .88);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .status-strip {
      display: none;
    }

    .category-pill {
      justify-self: start;
      display: inline-flex;
      align-items: center;
      min-width: 82px;
      max-width: 100%;
      height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      color: #fff;
      background: var(--rice);
      font-weight: 800;
      white-space: nowrap;
    }

    .result-id {
      color: var(--muted);
      font-size: .86rem;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .slot-area {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 390px;
      border-radius: 8px;
      padding: 18px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .98), rgba(255, 255, 255, .86)),
        radial-gradient(circle at 50% 0%, rgba(242, 200, 75, .28), transparent 45%);
      border: 1px solid var(--line);
      overflow: hidden;
    }

    .slot-area::before,
    .slot-area::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .slot-area::before {
      background:
        repeating-linear-gradient(90deg, rgba(21, 21, 21, .05) 0 1px, transparent 1px 16px),
        repeating-linear-gradient(0deg, rgba(21, 21, 21, .04) 0 1px, transparent 1px 18px);
      opacity: .45;
    }

    .slot-area::after {
      border: 10px solid rgba(21, 21, 21, .06);
      border-radius: 8px;
    }

    .slot-window {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 210px;
      display: grid;
      grid-template-rows: auto auto 1fr;
      align-items: center;
      justify-items: center;
      gap: 10px;
      text-align: center;
    }

    .slot-label {
      min-height: 28px;
      padding: 4px 10px;
      border: 1px solid rgba(21, 21, 21, .10);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255, 255, 255, .72);
      font-size: .9rem;
      font-weight: 750;
    }

    .question {
      max-width: 100%;
      color: var(--ink);
      font-size: 1.1rem;
      line-height: 1.25;
      font-weight: 900;
      word-break: keep-all;
      text-align: center;
    }

    .portrait-stage {
      position: relative;
      width: min(100%, 390px);
      min-height: 258px;
      display: grid;
      align-items: end;
      justify-items: center;
      padding-top: 66px;
      isolation: isolate;
    }

    .speech-bubble {
      position: absolute;
      top: 4px;
      left: 50%;
      z-index: 2;
      max-width: min(92%, 330px);
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 15px;
      border: 2px solid rgba(21, 21, 21, .86);
      border-radius: 999px;
      color: var(--ink);
      background: rgba(255, 255, 255, .96);
      box-shadow: 0 10px 24px rgba(21, 21, 21, .12);
      font-size: 1.05rem;
      line-height: 1.15;
      font-weight: 950;
      text-align: center;
      white-space: nowrap;
      transform: translateX(-50%);
    }

    .speech-bubble::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -11px;
      width: 18px;
      height: 18px;
      border-right: 2px solid rgba(21, 21, 21, .86);
      border-bottom: 2px solid rgba(21, 21, 21, .86);
      background: rgba(255, 255, 255, .96);
      transform: translateX(-50%) rotate(45deg);
    }

    .portrait {
      z-index: 1;
      width: min(96%, 360px);
      max-height: 310px;
      object-fit: contain;
      object-position: center bottom;
      filter: drop-shadow(0 18px 26px rgba(21, 21, 21, .18));
      user-select: none;
      pointer-events: none;
    }
    .dish {
      width: 100%;
      min-height: 72px;
      display: grid;
      place-items: center;
      padding: 10px 4px;
      font-size: 2.7rem;
      line-height: 1.08;
      font-weight: 950;
      letter-spacing: 0;
      word-break: keep-all;
      overflow-wrap: anywhere;
      text-wrap: balance;
    }

    .dish.is-long {
      font-size: 2.35rem;
    }

    .dish.is-extra-long {
      font-size: 1.85rem;
    }

    .note {
      min-height: 24px;
      color: var(--muted);
      font-size: .92rem;
      line-height: 1.35;
      word-break: keep-all;
    }

    .spinning .dish {
      filter: blur(.8px);
      transform: translateY(-1px);
    }

    .spinning .slot-label {
      color: var(--ink);
      border-color: rgba(21, 21, 21, .24);
    }

    .spark {
      position: absolute;
      z-index: 2;
      width: 9px;
      height: 9px;
      border-radius: 2px;
      background: var(--gold);
      opacity: 0;
      transform: translate(-50%, -50%) scale(.4);
      animation: pop .72s ease-out forwards;
      pointer-events: none;
    }

    @keyframes pop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(.3) rotate(0deg); }
      22% { opacity: 1; }
      100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(1) rotate(95deg); }
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      align-items: center;
    }

    .minor-button {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: #fff;
      font-weight: 800;
    }

    .history {
      display: none;
    }

    .history::-webkit-scrollbar {
      display: none;
    }

    .history-item {
      flex: 0 0 auto;
      max-width: 190px;
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .78);
      color: var(--ink);
      font-size: .86rem;
      font-weight: 750;
      white-space: nowrap;
    }

    .history-dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      flex: 0 0 auto;
      background: currentColor;
    }

    .history-name {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
    }

    .category-button {
      min-width: 0;
      min-height: 70px;
      display: grid;
      grid-template-rows: 24px auto;
      align-items: center;
      justify-items: center;
      gap: 4px;
      padding: 9px 5px;
      border-radius: 8px;
      color: #fff;
      background: var(--accent);
      box-shadow: 0 10px 22px rgba(21, 21, 21, .13);
      transition: transform .14s ease, box-shadow .14s ease;
      touch-action: manipulation;
    }

    .category-button:active {
      transform: translateY(1px) scale(.99);
      box-shadow: 0 5px 14px rgba(21, 21, 21, .14);
    }

    .category-button svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .category-button span {
      min-width: 0;
      max-width: 100%;
      font-size: .92rem;
      font-weight: 950;
      line-height: 1.05;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .category-button[data-category="밥"] { --accent: var(--rice); }
    .category-button[data-category="고기"] { --accent: var(--meat); }
    .category-button[data-category="국물"] { --accent: var(--soup); }
    .category-button[data-category="랜덤"] { --accent: var(--random); }
    .category-button[data-category="졍스팟"] { --accent: var(--spot); }

    .category-pill[data-category="밥"] { background: var(--rice); }
    .category-pill[data-category="고기"] { background: var(--meat); }
    .category-pill[data-category="국물"] { background: var(--soup); }
    .category-pill[data-category="랜덤"] { background: var(--random); }
    .category-pill[data-category="졍스팟"] { background: var(--spot); }

    dialog {
      width: min(100% - 24px, 640px);
      max-height: min(720px, 92svh);
      padding: 0;
      border: 0;
      border-radius: 8px;
      color: var(--ink);
      background: var(--panel);
      box-shadow: 0 26px 90px rgba(21, 21, 21, .28);
    }

    dialog::backdrop {
      background: rgba(21, 21, 21, .45);
      backdrop-filter: blur(4px);
    }

    .editor {
      display: grid;
      grid-template-rows: auto 1fr auto;
      max-height: min(720px, 92svh);
    }

    .editor-head,
    .editor-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px;
      border-bottom: 1px solid var(--line);
    }

    .editor-actions {
      border-top: 1px solid var(--line);
      border-bottom: 0;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .editor-title {
      margin: 0;
      font-size: 1.12rem;
      line-height: 1.2;
    }

    .editor-body {
      overflow: auto;
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .edit-group {
      display: grid;
      gap: 6px;
    }

    .edit-group label {
      font-weight: 900;
    }

    textarea {
      width: 100%;
      min-height: 130px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 11px;
      color: var(--ink);
      background: #fbfcf9;
      line-height: 1.45;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      z-index: 10;
      min-width: min(280px, calc(100% - 32px));
      max-width: calc(100% - 32px);
      padding: 12px 14px;
      border-radius: 8px;
      color: #fff;
      background: rgba(21, 21, 21, .92);
      box-shadow: 0 14px 34px rgba(21, 21, 21, .20);
      text-align: center;
      font-weight: 850;
      transform: translate(-50%, 18px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 470px) {
      .app {
        padding-left: 12px;
        padding-right: 12px;
      }

      .machine {
        grid-template-rows: minmax(360px, 1fr) auto;
        padding: 11px;
      }

      .slot-area {
        min-height: 360px;
        padding: 12px;
      }

      .slot-window {
        min-height: 318px;
        grid-template-rows: auto minmax(235px, 1fr) auto;
        gap: 8px;
      }

      .portrait-stage {
        width: 100%;
        min-height: 235px;
        padding-top: 58px;
      }

      .speech-bubble {
        max-width: 94%;
        min-height: 42px;
        padding: 9px 13px;
        font-size: .95rem;
      }

      .portrait {
        width: min(98%, 320px);
        max-height: 275px;
      }

      .dish {
        min-height: 58px;
        padding: 6px 2px;
        font-size: 2rem;
      }

      .dish.is-long {
        font-size: 1.65rem;
      }

      .dish.is-extra-long {
        font-size: 1.36rem;
      }

      .category-grid {
        gap: 6px;
      }

      .category-button {
        min-height: 62px;
        grid-template-rows: 20px auto;
        padding: 7px 3px;
      }

      .category-button svg {
        width: 20px;
        height: 20px;
      }

      .category-button span {
        font-size: .78rem;
      }

      .subtitle {
        max-width: 190px;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
      }
    }
    /* v8 jemechu compact updates */

    .dish.is-long { font-size: 1.68rem; }

    }

    .minor-button {

    }

    .star-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      color: var(--ink);
    }

      return Object.fromEntries(Object.entries(source).map(([category, rows]) => [category, rows.map(toMenuItem)]));

    function toMenuItem(item) {
      if (typeof item === "string") return { name: item.trim(), note: "" };
      if (Array.isArray(item)) return { name: String(item[0] || "").trim(), note: String(item[1] || "").trim() };
      return { name: String(item?.name || "").trim(), note: String(item?.note || "").trim() };
    }

    function loadMenus() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (!saved) return cloneMenus(DEFAULT_MENUS);
        return {
          "밥": normalizeSavedList(saved["밥"], DEFAULT_MENUS["밥"]),
          "고기": normalizeSavedList(saved["고기"], DEFAULT_MENUS["고기"]),
          "국물": normalizeSavedList(saved["국물"], DEFAULT_MENUS["국물"]),
          "졍스팟": normalizeSavedList(saved["졍스팟"], DEFAULT_MENUS["졍스팟"])

      } catch {
        return cloneMenus(DEFAULT_MENUS);

    }

    function normalizeSavedList(list, fallback) {
      if (!Array.isArray(list) || list.length === 0) return fallback.map(toMenuItem);
      const parsed = list.map(toMenuItem).filter((item) => item.name);
      return parsed.length ? parsed : fallback.map(toMenuItem);
    }

    function loadPicks() {
      let saved = [];
      try {
        const raw = JSON.parse(localStorage.getItem(PICKS_KEY));
        if (Array.isArray(raw)) saved = raw;
      } catch {}
      const merged = [...DEFAULT_PICKS, ...saved]
        .map(normalizePick)
        .filter(Boolean);
      return dedupePicks(merged);
    }

    function normalizePick(pick) {
      const date = String(pick?.date || "").trim();
      const name = String(pick?.name || "").trim();
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || !name) return null;
      return {
        id: makePickId(date, name),
        date,
        name,
        category: String(pick?.category || "지영").trim() || "지영"
      };
    }

    function dedupePicks(list) {
      const seen = new Set();
      return list.filter((pick) => {
        if (seen.has(pick.id)) return false;
        seen.add(pick.id);
        return true;
      });
    }

    function saveMenusToStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.menus));
    }

    function savePicks() {
      const custom = state.picks.filter((pick) => !DEFAULT_PICKS.some((base) => base.id === pick.id));
      localStorage.setItem(PICKS_KEY, JSON.stringify(custom));
    }

    function getPool(category) {
      if (category === "랜덤") {
        return CATEGORY_ORDER
          .filter((realCategory) => realCategory !== "랜덤")
          .flatMap((realCategory) => state.menus[realCategory].map((item, index) => ({ ...item, category: realCategory, index })));
      }
      return state.menus[category].map((item, index) => ({ ...item, category, index }));
    }

    function randomFrom(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    function todayISO(date = new Date()) {
      const yyyy = date.getFullYear();
      const mm = String(date.getMonth() + 1).padStart(2, "0");
      const dd = String(date.getDate()).padStart(2, "0");
      return `${yyyy}-${mm}-${dd}`;
    }

    function formatDateYYMMDD(date = new Date()) {
      const yy = String(date.getFullYear()).slice(-2);
      const mm = String(date.getMonth() + 1).padStart(2, "0");
      const dd = String(date.getDate()).padStart(2, "0");
      return `${yy}.${mm}.${dd}`;
    }

    function formatKoreanDate(value) {
      const [year, month, day] = value.split("-");
      return `${year}년 ${Number(month)}월 ${Number(day)}일`;
    }

    function makePickId(date, name) {
      return `${date}|${name.trim()}`;
    }

    function setDishText(name) {
      els.dishName.classList.toggle("is-long", name.length >= 9);
      els.dishName.classList.toggle("is-extra-long", name.length >= 14);
      els.dishName.textContent = name;
    }

    function setPose(kind) {
      const nextSrc = kind === "pointing" ? POINTING_IMAGE : IDLE_IMAGE;
      if (!els.portrait.src.endsWith(nextSrc)) els.portrait.src = nextSrc;
      els.slotArea.classList.toggle("result-ready", kind === "pointing");
    }

    function renderInitial() {
      state.finalized = false;
      state.currentItem = null;
      els.slotLabel.textContent = formatDateYYMMDD();
      els.speechBubble.textContent = "오늘의 메뉴는 ....";
      setDishText("오늘 뭐 먹지?");
      setPose("idle");
      updateStarUI();
      updateMenuCount();
    }

    function renderResult(category, item, finalized = false) {
      state.currentCategory = category;
      state.currentItem = item;
      state.finalized = finalized;
      els.categoryPill.dataset.category = category;
      els.categoryPill.textContent = category;
      if (els.resultId) els.resultId.textContent = "";
      els.slotLabel.textContent = formatDateYYMMDD();
      els.speechBubble.textContent = finalized ? "오늘의 메뉴는 이거야!" : "오늘의 메뉴는 ....";
      setDishText(item.name);
      setPose(finalized ? "pointing" : "idle");
      updateStarUI();
      updateMenuCount();
    }

    function updateMenuCount() {
      const total = getPool("랜덤").length;
      els.menuCount.textContent = `밥 ${state.menus["밥"].length} · 고기 ${state.menus["고기"].length} · 국물 ${state.menus["국물"].length} · 졍스팟 ${state.menus["졍스팟"].length} · 총 ${total}`;
    }

    function vibrate(pattern) {
      if ("vibrate" in navigator) navigator.vibrate(pattern);
    }

    function spin(category) {
      if (state.spinning) return;
      const pool = getPool(category);
      if (!pool.length) {
        showToast("메뉴가 비어 있어요");
        return;
      }

      const target = randomFrom(pool);
      const duration = 2150 + Math.floor(Math.random() * 520);
      const start = performance.now();
      let lastTick = 0;
      state.spinning = true;
      state.finalized = false;
      setPose("idle");
      setControlsDisabled(true);
      els.slotArea.classList.add("spinning");
      els.slotLabel.textContent = formatDateYYMMDD();
      vibrate(16);

      function frame(now) {
        const elapsed = now - start;
        const progress = Math.min(elapsed / duration, 1);
        const delay = 24 + progress * progress * 168;

        if (now - lastTick > delay) {
          renderResult(category, randomFrom(pool), false);
          lastTick = now;
        }

        if (progress < 1) {
          requestAnimationFrame(frame);
          return;
        }

        state.spinning = false;
        els.slotArea.classList.remove("spinning");
        renderResult(category, target, true);
        setControlsDisabled(false);
        burstSparks();
        vibrate([24, 36, 28]);
      }

      requestAnimationFrame(frame);
    }

    function setControlsDisabled(disabled) {
      $$(".category-button, #spinAgain").forEach((button) => { button.disabled = disabled; });
      updateStarUI();
    }

    function currentPickId() {
      if (!state.currentItem || !state.finalized) return "";
      return makePickId(todayISO(), state.currentItem.name);
    }

    function isCurrentStarred() {
      const id = currentPickId();
      return Boolean(id && state.picks.some((pick) => pick.id === id));
    }

    function updateStarUI() {
      const active = isCurrentStarred();
      els.starResult.disabled = state.spinning || !state.finalized || !state.currentItem;
      els.starResult.setAttribute("aria-pressed", String(active));
      const label = els.starResult.querySelector("span");
      if (label) label.textContent = active ? "별표됨" : "별표";
    }

    function toggleCurrentPick() {
      if (!state.currentItem || !state.finalized) return;
      const date = todayISO();
      const id = makePickId(date, state.currentItem.name);
      const exists = state.picks.some((pick) => pick.id === id);
      if (exists) {
        state.picks = state.picks.filter((pick) => pick.id !== id);
      } else {
        state.picks = dedupePicks([{ id, date, name: state.currentItem.name, category: state.currentItem.category }, ...state.picks]);
      }
      savePicks();
      renderPicks();
      updateStarUI();
      showToast(exists ? "별표를 껐어요" : "기록에 넣었어요");
    }

    function renderPicks() {
      els.pickList.innerHTML = "";
      const rows = [...state.picks].sort((a, b) => b.date.localeCompare(a.date));
      rows.forEach((pick) => {
        const row = document.createElement("div");
        row.className = "pick-row";

        const date = document.createElement("div");
        date.className = "pick-date";
        date.textContent = formatKoreanDate(pick.date);

        const name = document.createElement("div");
        name.className = "pick-name";
        name.textContent = pick.name;

        const remove = document.createElement("button");
        remove.className = "pick-remove";
        remove.type = "button";
        remove.setAttribute("aria-label", `${pick.name} 별표 끄기`);
        remove.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 14.7 9l6.1.9-4.4 4.3 1 6.1L12 17.4l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9Z"></path></svg>';
        remove.addEventListener("click", () => {
          state.picks = state.picks.filter((item) => item.id !== pick.id);
          savePicks();
          renderPicks();
          updateStarUI();
        });

        row.append(date, name, remove);
        els.pickList.appendChild(row);
      });
    }

    function addManualPick(event) {
      event.preventDefault();
      const date = els.pickDate.value || todayISO();
      const name = els.pickName.value.trim();
      if (!name) {
        showToast("메뉴를 적어줘요");
        return;
      }
      state.picks = dedupePicks([{ id: makePickId(date, name), date, name, category: "지영" }, ...state.picks]);
      savePicks();
      renderPicks();
      updateStarUI();
      els.pickName.value = "";
      showToast("추가했어요");
    }

    function showView(view) {
      const record = view === "record";
      els.rouletteView.hidden = record;
      els.recordView.hidden = !record;
      els.rouletteTab.classList.toggle("is-active", !record);
      els.recordTab.classList.toggle("is-active", record);
      els.rouletteTab.setAttribute("aria-selected", String(!record));
      els.recordTab.setAttribute("aria-selected", String(record));
      if (record) renderPicks();
    }

    function getCategoryColor(category) {
      if (category === "고기") return "var(--meat)";
      if (category === "국물") return "var(--soup)";
      if (category === "랜덤") return "var(--random)";
      if (category === "졍스팟") return "var(--spot)";
      return "var(--rice)";
    }

    function burstSparks() {
      const colors = ["#f2c84b", "#f05745", "#009a8d", "#cf3f86", "#222222"];
      for (let i = 0; i < 16; i += 1) {
        const spark = document.createElement("span");
        spark.className = "spark";
        spark.style.left = `${42 + Math.random() * 16}%`;
        spark.style.top = `${50 + Math.random() * 14}%`;
        spark.style.background = colors[i % colors.length];
        spark.style.setProperty("--tx", `${-120 + Math.random() * 240}px`);
        spark.style.setProperty("--ty", `${-140 + Math.random() * 210}px`);
        spark.style.animationDelay = `${Math.random() * 80}ms`;
        els.slotArea.appendChild(spark);
        spark.addEventListener("animationend", () => spark.remove(), { once: true });
      }
    }

    async function copyResult() {
      if (!state.currentItem || !state.finalized) {
        showToast("아직 메뉴가 없어요");
        return;
      }
      const text = `${formatDateYYMMDD()} ${state.currentItem.name}`;
      try {
        await navigator.clipboard.writeText(text);
        showToast("복사했어요");
      } catch {
        showToast(text);
      }
    }

    function showToast(message) {
      els.toast.textContent = message;
      els.toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => els.toast.classList.remove("show"), 1500);
    }

    function parseMenuLine(line) {
      return { name: line.trim(), note: "" };
    }

    function listToText(list) {
      return list.map((item) => item.name).join("\n");
    }

    function textToList(text, fallbackCategory) {
      const parsed = text.split(/\n+/).map(parseMenuLine).filter((item) => item.name);
      return parsed.length ? parsed : DEFAULT_MENUS[fallbackCategory].map(toMenuItem);
    }

    function openEditor() {
      els.editRice.value = listToText(state.menus["밥"]);
      els.editMeat.value = listToText(state.menus["고기"]);
      els.editSoup.value = listToText(state.menus["국물"]);
      els.editSpot.value = listToText(state.menus["졍스팟"]);
      if (typeof els.editorDialog.showModal === "function") els.editorDialog.showModal();
      else showToast("편집 창을 열 수 없어요");
    }

    function saveEditor() {
      state.menus["밥"] = textToList(els.editRice.value, "밥");
      state.menus["고기"] = textToList(els.editMeat.value, "고기");
      state.menus["국물"] = textToList(els.editSoup.value, "국물");
      state.menus["졍스팟"] = textToList(els.editSpot.value, "졍스팟");
      saveMenusToStorage();
      updateMenuCount();
      showToast("저장했어요");
    }

    function resetMenus() {
      state.menus = cloneMenus(DEFAULT_MENUS);
      saveMenusToStorage();
      els.editRice.value = listToText(state.menus["밥"]);
      els.editMeat.value = listToText(state.menus["고기"]);
      els.editSoup.value = listToText(state.menus["국물"]);
      els.editSpot.value = listToText(state.menus["졍스팟"]);
      updateMenuCount();
      renderInitial();
      showToast("기본 메뉴로 바꿨어요");
    }

    function attachEvents() {
      $$(".category-button").forEach((button) => button.addEventListener("click", () => spin(button.dataset.category)));
      els.spinAgain.addEventListener("click", () => spin(state.currentCategory || "랜덤"));
      els.copyResult.addEventListener("click", copyResult);
      els.starResult.addEventListener("click", toggleCurrentPick);
      els.rouletteTab.addEventListener("click", () => showView("roulette"));
      els.recordTab.addEventListener("click", () => showView("record"));
      els.pickForm.addEventListener("submit", addManualPick);
      els.openEditor.addEventListener("click", openEditor);
      els.saveMenus.addEventListener("click", saveEditor);
      els.resetMenus.addEventListener("click", resetMenus);
      document.addEventListener("keydown", (event) => {
        const target = event.target;
        const typing = target && (["INPUT", "TEXTAREA", "SELECT", "BUTTON"].includes(target.tagName) || target.isContentEditable);
        if (typing || event.repeat || state.spinning || els.editorDialog.open) return;
        const map = { "1": "밥", "2": "고기", "3": "국물", "4": "랜덤", "5": "졍스팟", "Enter": state.currentCategory || "랜덤", " ": state.currentCategory || "랜덤" };
        if (map[event.key]) {
          event.preventDefault();
          showView("roulette");
          spin(map[event.key]);
        }
      });
    }

    function registerServiceWorker() {
      if (!("serviceWorker" in navigator)) return;
      if (location.protocol !== "https:" && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") return;
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }

    function clearOldHistoryKeys() {
      try {
        Object.keys(localStorage)
          .filter((key) => key.startsWith("jemechu-roulette-history"))
          .forEach((key) => localStorage.removeItem(key));
      } catch {}
    }

    function init() {
      attachEvents();
      clearOldHistoryKeys();
      els.pickDate.value = todayISO();
      renderPicks();
      renderInitial();
      registerServiceWorker();
    }

    init();
  </script>
</body>
</html>
