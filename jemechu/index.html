<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f05745">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="?硫붿텛 猷곕젢">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>?硫붿텛 猷곕젢</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #f6f7f4;
      --ink: #151515;
      --muted: #62645f;
      --line: #d9ddd2;
      --panel: #ffffff;
      --rice: #009a8d;
      --meat: #f05745;
      --soup: #4f9d69;
      --random: #222222;
      --gold: #f2c84b;
      --shadow: 0 18px 50px rgba(21, 21, 21, .13);
      color-scheme: light;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      letter-spacing: 0;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100%;
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(240, 87, 69, .10), transparent 34%),
        linear-gradient(315deg, rgba(0, 154, 141, .12), transparent 38%),
        var(--bg);
      -webkit-tap-highlight-color: transparent;
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: .7;
    }

    .app {
      width: min(100%, 720px);
      min-height: 100svh;
      margin: 0 auto;
      padding: max(18px, env(safe-area-inset-top)) 16px max(22px, env(safe-area-inset-bottom));
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 14px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--ink);
      border: 3px solid #fff;
      border-radius: 8px;
      box-shadow: 0 8px 20px rgba(21, 21, 21, .18);
      flex: 0 0 auto;
    }

    .brand-mark svg {
      width: 28px;
      height: 28px;
    }

    .title {
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: 1.35rem;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: .88rem;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .icon-button {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: rgba(255, 255, 255, .82);
      box-shadow: 0 8px 20px rgba(21, 21, 21, .07);
    }

    .icon-button svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
    }

    .machine {
      align-self: stretch;
      display: grid;
      grid-template-rows: auto minmax(270px, 1fr) auto;
      gap: 12px;
      border: 1px solid rgba(21, 21, 21, .08);
      border-radius: 8px;
      padding: 14px;
      background: rgba(255, 255, 255, .88);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .status-strip {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      min-height: 36px;
    }

    .category-pill {
      justify-self: start;
      display: inline-flex;
      align-items: center;
      min-width: 82px;
      max-width: 100%;
      height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      color: #fff;
      background: var(--rice);
      font-weight: 800;
      white-space: nowrap;
    }

    .result-id {
      color: var(--muted);
      font-size: .86rem;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .slot-area {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 270px;
      border-radius: 8px;
      padding: 18px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .98), rgba(255, 255, 255, .86)),
        radial-gradient(circle at 50% 0%, rgba(242, 200, 75, .28), transparent 45%);
      border: 1px solid var(--line);
      overflow: hidden;
    }

    .slot-area::before,
    .slot-area::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .slot-area::before {
      background:
        repeating-linear-gradient(90deg, rgba(21, 21, 21, .05) 0 1px, transparent 1px 16px),
        repeating-linear-gradient(0deg, rgba(21, 21, 21, .04) 0 1px, transparent 1px 18px);
      opacity: .45;
    }

    .slot-area::after {
      border: 10px solid rgba(21, 21, 21, .06);
      border-radius: 8px;
    }

    .slot-window {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 210px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      align-items: center;
      justify-items: center;
      gap: 10px;
      text-align: center;
    }

    .slot-label {
      min-height: 28px;
      padding: 4px 10px;
      border: 1px solid rgba(21, 21, 21, .10);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255, 255, 255, .72);
      font-size: .9rem;
      font-weight: 750;
    }

    .dish {
      width: 100%;
      min-height: 112px;
      display: grid;
      place-items: center;
      padding: 10px 4px;
      font-size: 3.1rem;
      line-height: 1.08;
      font-weight: 950;
      letter-spacing: 0;
      word-break: keep-all;
      overflow-wrap: anywhere;
      text-wrap: balance;
    }

    .dish.is-long {
      font-size: 2.35rem;
    }

    .dish.is-extra-long {
      font-size: 1.85rem;
    }

    .note {
      min-height: 24px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.35;
      word-break: keep-all;
    }

    .spinning .dish {
      filter: blur(.8px);
      transform: translateY(-1px);
    }

    .spinning .slot-label {
      color: var(--ink);
      border-color: rgba(21, 21, 21, .24);
    }

    .spark {
      position: absolute;
      z-index: 2;
      width: 9px;
      height: 9px;
      border-radius: 2px;
      background: var(--gold);
      opacity: 0;
      transform: translate(-50%, -50%) scale(.4);
      animation: pop .72s ease-out forwards;
      pointer-events: none;
    }

    @keyframes pop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(.3) rotate(0deg); }
      22% { opacity: 1; }
      100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(1) rotate(95deg); }
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      align-items: center;
    }

    .minor-button {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: #fff;
      font-weight: 800;
    }

    .history {
      min-height: 42px;
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 2px 0 4px;
      scrollbar-width: none;
    }

    .history::-webkit-scrollbar {
      display: none;
    }

    .history-item {
      flex: 0 0 auto;
      max-width: 190px;
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .78);
      color: var(--ink);
      font-size: .86rem;
      font-weight: 750;
      white-space: nowrap;
    }

    .history-dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      flex: 0 0 auto;
      background: currentColor;
    }

    .history-name {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .category-button {
      min-width: 0;
      min-height: 76px;
      display: grid;
      grid-template-rows: 24px auto;
      align-items: center;
      justify-items: center;
      gap: 4px;
      padding: 10px 8px;
      border-radius: 8px;
      color: #fff;
      background: var(--accent);
      box-shadow: 0 10px 22px rgba(21, 21, 21, .13);
      transition: transform .14s ease, box-shadow .14s ease;
      touch-action: manipulation;
    }

    .category-button:active {
      transform: translateY(1px) scale(.99);
      box-shadow: 0 5px 14px rgba(21, 21, 21, .14);
    }

    .category-button svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .category-button span {
      min-width: 0;
      max-width: 100%;
      font-size: 1rem;
      font-weight: 950;
      line-height: 1.05;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .category-button[data-category="諛?] { --accent: var(--rice); }
    .category-button[data-category="怨좉린"] { --accent: var(--meat); }
    .category-button[data-category="援?Ъ"] { --accent: var(--soup); }
    .category-button[data-category="?쒕뜡"] { --accent: var(--random); }

    .category-pill[data-category="諛?] { background: var(--rice); }
    .category-pill[data-category="怨좉린"] { background: var(--meat); }
    .category-pill[data-category="援?Ъ"] { background: var(--soup); }
    .category-pill[data-category="?쒕뜡"] { background: var(--random); }

    dialog {
      width: min(100% - 24px, 640px);
      max-height: min(720px, 92svh);
      padding: 0;
      border: 0;
      border-radius: 8px;
      color: var(--ink);
      background: var(--panel);
      box-shadow: 0 26px 90px rgba(21, 21, 21, .28);
    }

    dialog::backdrop {
      background: rgba(21, 21, 21, .45);
      backdrop-filter: blur(4px);
    }

    .editor {
      display: grid;
      grid-template-rows: auto 1fr auto;
      max-height: min(720px, 92svh);
    }

    .editor-head,
    .editor-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px;
      border-bottom: 1px solid var(--line);
    }

    .editor-actions {
      border-top: 1px solid var(--line);
      border-bottom: 0;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .editor-title {
      margin: 0;
      font-size: 1.12rem;
      line-height: 1.2;
    }

    .editor-body {
      overflow: auto;
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .edit-group {
      display: grid;
      gap: 6px;
    }

    .edit-group label {
      font-weight: 900;
    }

    textarea {
      width: 100%;
      min-height: 130px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 11px;
      color: var(--ink);
      background: #fbfcf9;
      line-height: 1.45;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      z-index: 10;
      min-width: min(280px, calc(100% - 32px));
      max-width: calc(100% - 32px);
      padding: 12px 14px;
      border-radius: 8px;
      color: #fff;
      background: rgba(21, 21, 21, .92);
      box-shadow: 0 14px 34px rgba(21, 21, 21, .20);
      text-align: center;
      font-weight: 850;
      transform: translate(-50%, 18px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 470px) {
      .app {
        padding-left: 12px;
        padding-right: 12px;
      }

      .machine {
        grid-template-rows: auto minmax(245px, 1fr) auto;
        padding: 11px;
      }

      .slot-area {
        min-height: 245px;
        padding: 14px;
      }

      .slot-window {
        min-height: 188px;
      }

      .dish {
        min-height: 105px;
        font-size: 2.45rem;
      }

      .dish.is-long {
        font-size: 1.9rem;
      }

      .dish.is-extra-long {
        font-size: 1.52rem;
      }

      .category-button {
        min-height: 70px;
        padding: 9px 5px;
      }

      .category-button span {
        font-size: .95rem;
      }

      .subtitle {
        max-width: 190px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
      }
    }
  </style>
</head>

    function cloneMenus(source) {
      return Object.fromEntries(
        Object.entries(source).map(([category, rows]) => [
          category,
          rows.map(([name, note]) => ({ name, note }))
        ])
      );
    }

    function loadMenus() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (!saved) return cloneMenus(DEFAULT_MENUS);
        return {
          "諛?: normalizeSavedList(saved["諛?], DEFAULT_MENUS["諛?]),
          "怨좉린": normalizeSavedList(saved["怨좉린"], DEFAULT_MENUS["怨좉린"]),
          "援?Ъ": normalizeSavedList(saved["援?Ъ"], DEFAULT_MENUS["援?Ъ"])
        };
      } catch {
        return cloneMenus(DEFAULT_MENUS);
      }
    }

    function normalizeSavedList(list, fallback) {
      if (!Array.isArray(list) || list.length === 0) {
        return fallback.map(([name, note]) => ({ name, note }));
      }
      return list
        .map((item) => {
          if (typeof item === "string") return parseMenuLine(item);
          return {
            name: String(item.name || "").trim(),
            note: String(item.note || "").trim()
          };
        })
        .filter((item) => item.name);
    }

    function loadHistory() {
      try {
        const saved = JSON.parse(localStorage.getItem(HISTORY_KEY));
        return Array.isArray(saved) ? saved.slice(0, 8) : [];
      } catch {
        return [];
      }
    }

    function saveMenusToStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.menus));
    }

    function saveHistory() {
      localStorage.setItem(HISTORY_KEY, JSON.stringify(state.history.slice(0, 8)));
    }

    function getPool(category) {
      if (category === "?쒕뜡") {
        return ["諛?, "怨좉린", "援?Ъ"].flatMap((realCategory) =>
          state.menus[realCategory].map((item, index) => ({ ...item, category: realCategory, index }))
        );
      }
      return state.menus[category].map((item, index) => ({ ...item, category, index }));
    }

    function randomFrom(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    function getDisplayId(category, item) {
      const prefix = category === "?쒕뜡" ? CATEGORY_PREFIX["?쒕뜡"] : CATEGORY_PREFIX[item.category];
      const number = String(item.index + 1).padStart(3, "0");
      return `${prefix}-${number}`;
    }

    function setDishText(name) {
      els.dishName.classList.toggle("is-long", name.length >= 9);
      els.dishName.classList.toggle("is-extra-long", name.length >= 14);
      els.dishName.textContent = name;
    }

    function renderResult(category, item, label = "?ㅻ뒛 ???) {
      state.currentCategory = category;
      state.currentItem = item;
      els.categoryPill.dataset.category = category;
      els.categoryPill.textContent = category;
      els.resultId.textContent = getDisplayId(category, item);
      els.slotLabel.textContent = label;
      setDishText(item.name);
      els.dishNote.textContent = item.note || `${item.category} ?꾨낫`;
      updateMenuCount();
    }

    function updateMenuCount() {
      const total = getPool("?쒕뜡").length;
      els.menuCount.textContent = `諛?${state.menus["諛?].length} 쨌 怨좉린 ${state.menus["怨좉린"].length} 쨌 援?Ъ ${state.menus["援?Ъ"].length} 쨌 珥?${total}`;
    }

    function vibrate(pattern) {
      if ("vibrate" in navigator) {
        navigator.vibrate(pattern);
      }
    }

    function spin(category) {
      if (state.spinning) return;
      const pool = getPool(category);
      if (!pool.length) {
        showToast("硫붾돱媛 鍮꾩뼱 ?덉뼱??);
        return;
      }

      const target = randomFrom(pool);
      const duration = 2350 + Math.floor(Math.random() * 650);
      const start = performance.now();
      let lastTick = 0;
      state.spinning = true;
      setControlsDisabled(true);
      els.slotArea.classList.add("spinning");
      els.slotLabel.textContent = "?뚯븘媛??以?;
      vibrate(16);

      function frame(now) {
        const elapsed = now - start;
        const progress = Math.min(elapsed / duration, 1);
        const delay = 26 + progress * progress * 175;

        if (now - lastTick > delay) {
          const item = randomFrom(pool);
          renderResult(category, item, progress > .72 ? "?ъ뒳 硫덉텛??以? : "?뚯븘媛??以?);
          lastTick = now;
        }

        if (progress < 1) {
          requestAnimationFrame(frame);
          return;
        }

        state.spinning = false;
        els.slotArea.classList.remove("spinning");
        renderResult(category, target, "?뱀꺼");
        addHistory(category, target);
        setControlsDisabled(false);
        burstSparks();
        vibrate([24, 36, 28]);
      }

      requestAnimationFrame(frame);
    }

    function setControlsDisabled(disabled) {
      $$(".category-button, #spinAgain").forEach((button) => {
        button.disabled = disabled;
      });
    }

    function addHistory(category, item) {
      state.history.unshift({
        category,
        realCategory: item.category,
        name: item.name,
        note: item.note,
        index: item.index,
        time: Date.now()
      });
      state.history = state.history.slice(0, 8);
      saveHistory();
      renderHistory();
    }

    function renderHistory() {
      els.history.innerHTML = "";
      state.history.forEach((item) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "history-item";
        button.setAttribute("aria-label", `${item.name} ?ㅼ떆 蹂닿린`);
        button.innerHTML = `<span class="history-dot" aria-hidden="true"></span><span class="history-name"></span>`;
        button.querySelector(".history-name").textContent = item.name;
        button.style.color = getCategoryColor(item.realCategory || item.category);
        button.addEventListener("click", () => {
          renderResult(item.category, {
            category: item.realCategory || item.category,
            name: item.name,
            note: item.note,
            index: Number.isFinite(item.index) ? item.index : 0
          }, "理쒓렐 寃곌낵");
        });
        els.history.appendChild(button);
      });
    }

    function getCategoryColor(category) {
      if (category === "怨좉린") return "var(--meat)";
      if (category === "援?Ъ") return "var(--soup)";
      if (category === "?쒕뜡") return "var(--random)";
      return "var(--rice)";
    }

    function burstSparks() {
      const colors = ["#f2c84b", "#f05745", "#009a8d", "#4f9d69", "#222222"];
      for (let i = 0; i < 18; i += 1) {
        const spark = document.createElement("span");
        spark.className = "spark";
        spark.style.left = `${46 + Math.random() * 8}%`;
        spark.style.top = `${47 + Math.random() * 8}%`;
        spark.style.background = colors[i % colors.length];
        spark.style.setProperty("--tx", `${-120 + Math.random() * 240}px`);
        spark.style.setProperty("--ty", `${-140 + Math.random() * 210}px`);
        spark.style.animationDelay = `${Math.random() * 80}ms`;
        els.slotArea.appendChild(spark);
        spark.addEventListener("animationend", () => spark.remove(), { once: true });
      }
    }

    async function copyResult() {
      if (!state.currentItem) return;
      const text = `[${state.currentCategory}] ${state.currentItem.name} - ${state.currentItem.note}`;
      try {
        await navigator.clipboard.writeText(text);
        showToast("蹂듭궗?덉뼱??);
      } catch {
        showToast(text);
      }
    }

    function showToast(message) {
      els.toast.textContent = message;
      els.toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => {
        els.toast.classList.remove("show");
      }, 1500);
    }

    function parseMenuLine(line) {
      const [rawName, ...rawNote] = line.split("|");
      return {
        name: rawName.trim(),
        note: rawNote.join("|").trim()
      };
    }

    function listToText(list) {
      return list.map((item) => item.note ? `${item.name} | ${item.note}` : item.name).join("\n");
    }

    function textToList(text, fallbackCategory) {
      const parsed = text
        .split(/\n+/)
        .map(parseMenuLine)
        .filter((item) => item.name)
        .map((item) => ({
          name: item.name,
          note: item.note || `${fallbackCategory} ?꾨낫`
        }));
      return parsed.length ? parsed : cloneMenus({ [fallbackCategory]: DEFAULT_MENUS[fallbackCategory] })[fallbackCategory];
    }

    function openEditor() {
      els.editRice.value = listToText(state.menus["諛?]);
      els.editMeat.value = listToText(state.menus["怨좉린"]);
      els.editSoup.value = listToText(state.menus["援?Ъ"]);
      if (typeof els.editorDialog.showModal === "function") {
        els.editorDialog.showModal();
      } else {
        showToast("??釉뚮씪?곗????몄쭛 李쎌쓣 吏?먰븯吏 ?딆븘??);
      }
    }

    function saveEditor() {
      state.menus["諛?] = textToList(els.editRice.value, "諛?);
      state.menus["怨좉린"] = textToList(els.editMeat.value, "怨좉린");
      state.menus["援?Ъ"] = textToList(els.editSoup.value, "援?Ъ");
      saveMenusToStorage();
      updateMenuCount();
      showToast("??ν뻽?댁슂");
    }

    function resetMenus() {
      state.menus = cloneMenus(DEFAULT_MENUS);
      saveMenusToStorage();
      els.editRice.value = listToText(state.menus["諛?]);
      els.editMeat.value = listToText(state.menus["怨좉린"]);
      els.editSoup.value = listToText(state.menus["援?Ъ"]);
      updateMenuCount();
      showToast("湲곕낯 硫붾돱濡?諛붽엥?댁슂");
    }

    function attachEvents() {
      $$(".category-button").forEach((button) => {
        button.addEventListener("click", () => spin(button.dataset.category));
      });
      els.spinAgain.addEventListener("click", () => spin(state.currentCategory || "?쒕뜡"));
      els.copyResult.addEventListener("click", copyResult);
      els.openEditor.addEventListener("click", openEditor);
      els.saveMenus.addEventListener("click", saveEditor);
      els.resetMenus.addEventListener("click", resetMenus);
      document.addEventListener("keydown", (event) => {
        if (event.repeat || state.spinning || els.editorDialog.open) return;
        const map = {
          "1": "諛?,
          "2": "怨좉린",
          "3": "援?Ъ",
          "4": "?쒕뜡",
          "Enter": state.currentCategory || "?쒕뜡",
          " ": state.currentCategory || "?쒕뜡"
        };
        if (map[event.key]) {
          event.preventDefault();
          spin(map[event.key]);
        }
      });
    }

    function registerServiceWorker() {
      if (!("serviceWorker" in navigator)) return;
      if (location.protocol !== "https:" && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") return;
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }

    function init() {
      attachEvents();
      renderHistory();
      renderResult("諛?, { ...state.menus["諛?][0], category: "諛?, index: 0 }, "?ㅻ뒛 ???);
      registerServiceWorker();
    }

    init();
  </script>
</body>
</html>
