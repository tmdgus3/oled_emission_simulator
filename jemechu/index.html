<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f05745">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="what to eat">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>what to eat</title>
  <meta name="description" content="지영이가 골라주는 오늘의 뭐먹지?">
  <meta property="og:type" content="website">
  <meta property="og:title" content="what to eat">
  <meta property="og:description" content="지영이가 골라주는 오늘의 뭐먹지?">
  <meta property="og:url" content="https://cothiol.info/jemechu/">
  <meta property="og:image" content="https://cothiol.info/jemechu/jiyoung.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="what to eat">
  <meta name="twitter:description" content="지영이가 골라주는 오늘의 뭐먹지?">
  <meta name="twitter:image" content="https://cothiol.info/jemechu/jiyoung.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #f6f7f4;
      --ink: #151515;
      --muted: #62645f;
      --line: #d9ddd2;
      --panel: #ffffff;
      --rice: #009a8d;
      --meat: #f05745;
      --soup: #4f9d69;
      --random: #222222;
      --gold: #f2c84b;
      --shadow: 0 18px 50px rgba(21, 21, 21, .13);
      color-scheme: light;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      letter-spacing: 0;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100%;
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(240, 87, 69, .10), transparent 34%),
        linear-gradient(315deg, rgba(0, 154, 141, .12), transparent 38%),
        var(--bg);
      -webkit-tap-highlight-color: transparent;
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: .7;
    }

    .app {
      width: min(100%, 720px);
      min-height: 100svh;
      margin: 0 auto;
      padding: max(18px, env(safe-area-inset-top)) 16px max(22px, env(safe-area-inset-bottom));
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 14px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--ink);
      border: 3px solid #fff;
      border-radius: 8px;
      box-shadow: 0 8px 20px rgba(21, 21, 21, .18);
      flex: 0 0 auto;
    }

    .brand-mark svg {
      width: 28px;
      height: 28px;
    }

    .title {
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: 1.35rem;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: .88rem;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .icon-button {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: rgba(255, 255, 255, .82);
      box-shadow: 0 8px 20px rgba(21, 21, 21, .07);
    }

    .icon-button svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
    }

    .machine {
      align-self: stretch;
      display: grid;
      grid-template-rows: minmax(390px, 1fr) auto;
      gap: 12px;
      border: 1px solid rgba(21, 21, 21, .08);
      border-radius: 8px;
      padding: 14px;
      background: rgba(255, 255, 255, .88);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .status-strip {
      display: none;
    }

    .category-pill {
      justify-self: start;
      display: inline-flex;
      align-items: center;
      min-width: 82px;
      max-width: 100%;
      height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      color: #fff;
      background: var(--rice);
      font-weight: 800;
      white-space: nowrap;
    }

    .result-id {
      color: var(--muted);
      font-size: .86rem;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .slot-area {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 390px;
      border-radius: 8px;
      padding: 18px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .98), rgba(255, 255, 255, .86)),
        radial-gradient(circle at 50% 0%, rgba(242, 200, 75, .28), transparent 45%);
      border: 1px solid var(--line);
      overflow: hidden;
    }

    .slot-area::before,
    .slot-area::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .slot-area::before {
      background:
        repeating-linear-gradient(90deg, rgba(21, 21, 21, .05) 0 1px, transparent 1px 16px),
        repeating-linear-gradient(0deg, rgba(21, 21, 21, .04) 0 1px, transparent 1px 18px);
      opacity: .45;
    }

    .slot-area::after {
      border: 10px solid rgba(21, 21, 21, .06);
      border-radius: 8px;
    }

    .slot-window {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 210px;
      display: grid;
      grid-template-rows: auto auto 1fr;
      align-items: center;
      justify-items: center;
      gap: 10px;
      text-align: center;
    }

    .slot-label {
      min-height: 28px;
      padding: 4px 10px;
      border: 1px solid rgba(21, 21, 21, .10);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255, 255, 255, .72);
      font-size: .9rem;
      font-weight: 750;
    }

    .question {
      max-width: 100%;
      color: var(--ink);
      font-size: 1.1rem;
      line-height: 1.25;
      font-weight: 900;
      word-break: keep-all;
      text-align: center;
    }

    .portrait-stage {
      position: relative;
      width: min(100%, 390px);
      min-height: 258px;
      display: grid;
      align-items: end;
      justify-items: center;
      padding-top: 66px;
      isolation: isolate;
    }

    .speech-bubble {
      position: absolute;
      top: 4px;
      left: 50%;
      z-index: 2;
      max-width: min(92%, 330px);
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 15px;
      border: 2px solid rgba(21, 21, 21, .86);
      border-radius: 999px;
      color: var(--ink);
      background: rgba(255, 255, 255, .96);
      box-shadow: 0 10px 24px rgba(21, 21, 21, .12);
      font-size: 1.05rem;
      line-height: 1.15;
      font-weight: 950;
      text-align: center;
      white-space: nowrap;
      transform: translateX(-50%);
    }

    .speech-bubble::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -11px;
      width: 18px;
      height: 18px;
      border-right: 2px solid rgba(21, 21, 21, .86);
      border-bottom: 2px solid rgba(21, 21, 21, .86);
      background: rgba(255, 255, 255, .96);
      transform: translateX(-50%) rotate(45deg);
    }

    .portrait {
      z-index: 1;
      width: min(96%, 360px);
      max-height: 310px;
      object-fit: contain;
      object-position: center bottom;
      filter: drop-shadow(0 18px 26px rgba(21, 21, 21, .18));
      user-select: none;
      pointer-events: none;
    }
    .dish {
      width: 100%;
      min-height: 72px;
      display: grid;
      place-items: center;
      padding: 10px 4px;
      font-size: 2.7rem;
      line-height: 1.08;
      font-weight: 950;
      letter-spacing: 0;
      word-break: keep-all;
      overflow-wrap: anywhere;
      text-wrap: balance;
    }

    .dish.is-long {
      font-size: 2.35rem;
    }

    .dish.is-extra-long {
      font-size: 1.85rem;
    }

    .note {
      min-height: 24px;
      color: var(--muted);
      font-size: .92rem;
      line-height: 1.35;
      word-break: keep-all;
    }

    .spinning .dish {
      filter: blur(.8px);
      transform: translateY(-1px);
    }

    .spinning .slot-label {
      color: var(--ink);
      border-color: rgba(21, 21, 21, .24);
    }

    .spark {
      position: absolute;
      z-index: 2;
      width: 9px;
      height: 9px;
      border-radius: 2px;
      background: var(--gold);
      opacity: 0;
      transform: translate(-50%, -50%) scale(.4);
      animation: pop .72s ease-out forwards;
      pointer-events: none;
    }

    @keyframes pop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(.3) rotate(0deg); }
      22% { opacity: 1; }
      100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(1) rotate(95deg); }
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      align-items: center;
    }

    .minor-button {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: #fff;
      font-weight: 800;
    }

    .history {
      display: none;
    }

    .history::-webkit-scrollbar {
      display: none;
    }

    .history-item {
      flex: 0 0 auto;
      max-width: 190px;
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .78);
      color: var(--ink);
      font-size: .86rem;
      font-weight: 750;
      white-space: nowrap;
    }

    .history-dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      flex: 0 0 auto;
      background: currentColor;
    }

    .history-name {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
    }

    .category-button {
      min-width: 0;
      min-height: 70px;
      display: grid;
      grid-template-rows: 24px auto;
      align-items: center;
      justify-items: center;
      gap: 4px;
      padding: 9px 5px;
      border-radius: 8px;
      color: #fff;
      background: var(--accent);
      box-shadow: 0 10px 22px rgba(21, 21, 21, .13);
      transition: transform .14s ease, box-shadow .14s ease;
      touch-action: manipulation;
    }

    .category-button:active {
      transform: translateY(1px) scale(.99);
      box-shadow: 0 5px 14px rgba(21, 21, 21, .14);
    }

    .category-button svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .category-button span {
      min-width: 0;
      max-width: 100%;
      font-size: .92rem;
      font-weight: 950;
      line-height: 1.05;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .category-button[data-category="밥"] { --accent: var(--rice); }
    .category-button[data-category="고기"] { --accent: var(--meat); }
    .category-button[data-category="국물"] { --accent: var(--soup); }
    .category-button[data-category="랜덤"] { --accent: var(--random); }
    .category-button[data-category="졍스팟"] { --accent: var(--spot); }

    .category-pill[data-category="밥"] { background: var(--rice); }
    .category-pill[data-category="고기"] { background: var(--meat); }
    .category-pill[data-category="국물"] { background: var(--soup); }
    .category-pill[data-category="랜덤"] { background: var(--random); }
    .category-pill[data-category="졍스팟"] { background: var(--spot); }

    dialog {
      width: min(100% - 24px, 640px);
      max-height: min(720px, 92svh);
      padding: 0;
      border: 0;
      border-radius: 8px;
      color: var(--ink);
      background: var(--panel);
      box-shadow: 0 26px 90px rgba(21, 21, 21, .28);
    }

    dialog::backdrop {
      background: rgba(21, 21, 21, .45);
      backdrop-filter: blur(4px);
    }

    .editor {
      display: grid;
      grid-template-rows: auto 1fr auto;
      max-height: min(720px, 92svh);
    }

    .editor-head,
    .editor-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px;
      border-bottom: 1px solid var(--line);
    }

    .editor-actions {
      border-top: 1px solid var(--line);
      border-bottom: 0;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .editor-title {
      margin: 0;
      font-size: 1.12rem;
      line-height: 1.2;
    }

    .editor-body {
      overflow: auto;
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .edit-group {
      display: grid;
      gap: 6px;
    }

    .edit-group label {
      font-weight: 900;
    }

    textarea {
      width: 100%;
      min-height: 130px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 11px;
      color: var(--ink);
      background: #fbfcf9;
      line-height: 1.45;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      z-index: 10;
      min-width: min(280px, calc(100% - 32px));
      max-width: calc(100% - 32px);
      padding: 12px 14px;
      border-radius: 8px;
      color: #fff;
      background: rgba(21, 21, 21, .92);
      box-shadow: 0 14px 34px rgba(21, 21, 21, .20);
      text-align: center;
      font-weight: 850;
      transform: translate(-50%, 18px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 470px) {
      .app {
        padding-left: 12px;
        padding-right: 12px;
      }

      .machine {
        grid-template-rows: minmax(360px, 1fr) auto;
        padding: 11px;
      }

      .slot-area {
        min-height: 360px;
        padding: 12px;
      }

      .slot-window {
        min-height: 318px;
        grid-template-rows: auto minmax(235px, 1fr) auto;
        gap: 8px;
      }

      .portrait-stage {
        width: 100%;
        min-height: 235px;
        padding-top: 58px;
      }

      .speech-bubble {
        max-width: 94%;
        min-height: 42px;
        padding: 9px 13px;
        font-size: .95rem;
      }

      .portrait {
        width: min(98%, 320px);
        max-height: 275px;
      }

      .dish {
        min-height: 58px;
        padding: 6px 2px;
        font-size: 2rem;
      }

      .dish.is-long {
        font-size: 1.65rem;
      }

      .dish.is-extra-long {
        font-size: 1.36rem;
      }

      .category-grid {
        gap: 6px;
      }

      .category-button {
        min-height: 62px;
        grid-template-rows: 20px auto;
        padding: 7px 3px;
      }

      .category-button svg {
        width: 20px;
        height: 20px;
      }

      .category-button span {
        font-size: .78rem;
      }

      .subtitle {
        max-width: 190px;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" role="img">
            <path d="M7 11h18"></path>
            <path d="M9 11l2 14h10l2-14"></path>
            <path d="M11 8c1.4-2.4 3.2-3.6 5-3.6S19.6 5.6 21 8"></path>
            <path d="M12 16h8"></path>
          </svg>
        </div>
        <div class="title">
          <h1>what to eat</h1>
          <div class="subtitle" id="menuCount">메뉴 계산 중</div>
        </div>
      </div>
      <button class="icon-button" id="openEditor" type="button" aria-label="메뉴 편집">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 20h9"></path>
          <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
        </svg>
      </button>
    </header>

    <section class="machine" aria-live="polite">
      <div class="status-strip">
        <div class="category-pill" id="categoryPill" data-category="밥">밥</div>
        <div class="result-id" id="resultId" aria-hidden="true"></div>
      </div>

      <div class="slot-area" id="slotArea">
        <div class="slot-window">
          <div class="slot-label" id="slotLabel">26.09.04</div>
          <div class="portrait-stage">
            <div class="speech-bubble" id="speechBubble">오늘의 메뉴는 ....</div>
            <img class="portrait" src="jiyoung.png" alt="지영이 메뉴 추천">
          </div>
          <div class="dish" id="dishName">제육덮밥</div>
        </div>
      </div>

      <div class="actions">
        <button class="minor-button" id="copyResult" type="button">결과 복사</button>
        <button class="minor-button" id="spinAgain" type="button">한 번 더</button>
      </div>
    </section>

    <footer>
      <nav class="category-grid" aria-label="메뉴 카테고리">
        <button class="category-button" type="button" data-category="밥">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 11c0 5 3.5 9 8 9s8-4 8-9Z"></path>
            <path d="M7 11c1.2-1.6 2.9-2.4 5-2.4s3.8.8 5 2.4"></path>
            <path d="M9 7V4"></path>
            <path d="M13 7V3"></path>
            <path d="M17 7V4"></path>
          </svg>
          <span>밥</span>
        </button>
        <button class="category-button" type="button" data-category="고기">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7.5 14.5C4.7 11.7 4.2 8 6.4 5.8s5.9-1.7 8.7 1.1 3.3 6.5 1.1 8.7-5.9 1.7-8.7-1.1Z"></path>
            <path d="M15.3 15.1 20 20"></path>
            <path d="M18.2 19.8c.9.4 1.8.2 2.3-.3s.7-1.4.3-2.3"></path>
            <path d="M9.2 8.6h.01"></path>
          </svg>
          <span>고기</span>
        </button>
        <button class="category-button" type="button" data-category="국물">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12h14l-1.1 6.2A3.4 3.4 0 0 1 14.5 21h-5a3.4 3.4 0 0 1-3.4-2.8Z"></path>
            <path d="M7 12c.5-1.8 2.2-3 5-3s4.5 1.2 5 3"></path>
            <path d="M9 5c-.7.8-.7 1.5 0 2.3"></path>
            <path d="M13 3.6c-.8 1-.8 2 0 3"></path>
            <path d="M17 5c-.7.8-.7 1.5 0 2.3"></path>
          </svg>
          <span>국물</span>
        </button>
        <button class="category-button" type="button" data-category="랜덤">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M16 3h5v5"></path>
            <path d="M4 20 21 3"></path>
            <path d="M21 16v5h-5"></path>
            <path d="M15 15 21 21"></path>
            <path d="M4 4l5.5 5.5"></path>
          </svg>
          <span>랜덤</span>
        </button>
        <button class="category-button" type="button" data-category="졍스팟">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3.5 14.7 9l6.1.9-4.4 4.3 1 6.1L12 17.4l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9Z"></path>
          </svg>
          <span>졍스팟</span>
        </button>
      </nav>
      <div class="history" id="history" aria-label="최근 결과"></div>
    </footer>
  </main>

  <dialog id="editorDialog">
    <form class="editor" method="dialog">
      <div class="editor-head">
        <h2 class="editor-title">메뉴 편집</h2>
        <button class="icon-button" id="closeEditor" value="cancel" type="submit" aria-label="닫기">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 6 6 18"></path>
            <path d="M6 6l12 12"></path>
          </svg>
        </button>
      </div>
      <div class="editor-body">
        <div class="edit-group">
          <label for="editRice">밥</label>

    function cloneMenus(source) {
      return Object.fromEntries(
        Object.entries(source).map(([category, rows]) => [
          category,
          rows.map(([name, note]) => ({ name, note }))
        ])
      );
    }

    function loadMenus() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (!saved) return cloneMenus(DEFAULT_MENUS);
        return {
          "밥": normalizeSavedList(saved["밥"], DEFAULT_MENUS["밥"]),
          "고기": normalizeSavedList(saved["고기"], DEFAULT_MENUS["고기"]),
          "국물": normalizeSavedList(saved["국물"], DEFAULT_MENUS["국물"]),
          "졍스팟": normalizeSavedList(saved["졍스팟"], DEFAULT_MENUS["졍스팟"])
        };
      } catch {
        return cloneMenus(DEFAULT_MENUS);
      }
    }

    function normalizeSavedList(list, fallback) {
      if (!Array.isArray(list) || list.length === 0) {
        return fallback.map(([name, note]) => ({ name, note }));
      }
      return list
        .map((item) => {
          if (typeof item === "string") return parseMenuLine(item);
          return {
            name: String(item.name || "").trim(),
            note: String(item.note || "").trim()
          };
        })
        .filter((item) => item.name);
    }

    function loadHistory() {
      return [];
    } catch {
        return [];
      }
    }

    function saveMenusToStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.menus));
    }

    function saveHistory() {
      clearStoredHistory();
    }

    function getPool(category) {
      if (category === "랜덤") {
        return CATEGORY_ORDER.filter((realCategory) => realCategory !== "랜덤").flatMap((realCategory) =>
          state.menus[realCategory].map((item, index) => ({ ...item, category: realCategory, index }))
        );
      }
      return state.menus[category].map((item, index) => ({ ...item, category, index }));
    }

    function randomFrom(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    function formatDateYYMMDD(date = new Date()) {
      const yy = String(date.getFullYear()).slice(-2);
      const mm = String(date.getMonth() + 1).padStart(2, "0");
      const dd = String(date.getDate()).padStart(2, "0");
      return `${yy}.${mm}.${dd}`;
    }

    function getDisplayId(category, item) {
      const prefix = category === "랜덤" ? CATEGORY_PREFIX["랜덤"] : CATEGORY_PREFIX[item.category];
      const number = String(item.index + 1).padStart(3, "0");
      return `${prefix}-${number}`;
    }

    function setDishText(name) {
      els.dishName.classList.toggle("is-long", name.length >= 9);
      els.dishName.classList.toggle("is-extra-long", name.length >= 14);
      els.dishName.textContent = name;
    }

    function renderResult(category, item, label = "오늘 저녁") {
      state.currentCategory = category;
      state.currentItem = item;
      els.categoryPill.dataset.category = category;
      els.categoryPill.textContent = category;
      if (els.resultId) {
        els.resultId.textContent = "";
      }
      els.slotLabel.textContent = formatDateYYMMDD();
      setDishText(item.name);
      if (els.dishNote) {
        els.dishNote.textContent = item.note || `${item.category} 후보`;
      }
      updateMenuCount();
    }

    function updateMenuCount() {
      const total = getPool("랜덤").length;
      els.menuCount.textContent = `밥 ${state.menus["밥"].length} · 고기 ${state.menus["고기"].length} · 국물 ${state.menus["국물"].length} · 졍스팟 ${state.menus["졍스팟"].length} · 총 ${total}`;
    }

    function vibrate(pattern) {
      if ("vibrate" in navigator) {
        navigator.vibrate(pattern);
      }
    }

    function spin(category) {
      if (state.spinning) return;
      const pool = getPool(category);
      if (!pool.length) {
        showToast("메뉴가 비어 있어요");
        return;
      }

      const target = randomFrom(pool);
      const duration = 2350 + Math.floor(Math.random() * 650);
      const start = performance.now();
      let lastTick = 0;
      state.spinning = true;
      setControlsDisabled(true);
      els.slotArea.classList.add("spinning");
      els.slotLabel.textContent = formatDateYYMMDD();
      vibrate(16);

      function frame(now) {
        const elapsed = now - start;
        const progress = Math.min(elapsed / duration, 1);
        const delay = 26 + progress * progress * 175;

        if (now - lastTick > delay) {
          const item = randomFrom(pool);
          renderResult(category, item, progress > .72 ? "슬슬 멈추는 중" : "돌아가는 중");
          lastTick = now;
        }

        if (progress < 1) {
          requestAnimationFrame(frame);
          return;
        }

        state.spinning = false;
        els.slotArea.classList.remove("spinning");
        renderResult(category, target, "당첨");
        clearStoredHistory();
        setControlsDisabled(false);
        burstSparks();
        vibrate([24, 36, 28]);
      }

      requestAnimationFrame(frame);
    }

    function setControlsDisabled(disabled) {
      $$(".category-button, #spinAgain").forEach((button) => {
        button.disabled = disabled;
      });
    }

    function addHistory() {
      state.history = [];
      clearStoredHistory();
      renderHistory();
    }

    function renderHistory() {
      els.history.innerHTML = "";
    }

    function clearStoredHistory() {
      try {
        Object.keys(localStorage)
          .filter((key) => key.startsWith("jemechu-roulette-history"))
          .forEach((key) => localStorage.removeItem(key));
      } catch {}
    }

    function getCategoryColor(category) {
      if (category === "고기") return "var(--meat)";
      if (category === "국물") return "var(--soup)";
      if (category === "랜덤") return "var(--random)";
      if (category === "졍스팟") return "var(--spot)";
      return "var(--rice)";
    }

    function burstSparks() {
      const colors = ["#f2c84b", "#f05745", "#009a8d", "#4f9d69", "#222222"];
      for (let i = 0; i < 18; i += 1) {
        const spark = document.createElement("span");
        spark.className = "spark";
        spark.style.left = `${46 + Math.random() * 8}%`;
        spark.style.top = `${47 + Math.random() * 8}%`;
        spark.style.background = colors[i % colors.length];
        spark.style.setProperty("--tx", `${-120 + Math.random() * 240}px`);
        spark.style.setProperty("--ty", `${-140 + Math.random() * 210}px`);
        spark.style.animationDelay = `${Math.random() * 80}ms`;
        els.slotArea.appendChild(spark);
        spark.addEventListener("animationend", () => spark.remove(), { once: true });
      }
    }

    async function copyResult() {
      if (!state.currentItem) return;
      const text = `[${state.currentCategory}] ${state.currentItem.name}`;
      try {
        await navigator.clipboard.writeText(text);
        showToast("복사했어요");
      } catch {
        showToast(text);
      }
    }

    function showToast(message) {
      els.toast.textContent = message;
      els.toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => {
        els.toast.classList.remove("show");
      }, 1500);
    }

    function parseMenuLine(line) {
      const [rawName, ...rawNote] = line.split("|");
      return {
        name: rawName.trim(),
        note: rawNote.join("|").trim()
      };
    }

    function listToText(list) {
      return list.map((item) => item.name).join("\n");
    }

    function textToList(text, fallbackCategory) {
      const parsed = text
        .split(/\n+/)
        .map(parseMenuLine)
        .filter((item) => item.name)
        .map((item) => ({
          name: item.name,
          note: item.note || `${fallbackCategory} 후보`
        }));
      return parsed.length ? parsed : cloneMenus({ [fallbackCategory]: DEFAULT_MENUS[fallbackCategory] })[fallbackCategory];
    }

    function openEditor() {
      els.editRice.value = listToText(state.menus["밥"]);
      els.editMeat.value = listToText(state.menus["고기"]);
      els.editSoup.value = listToText(state.menus["국물"]);
      els.editSpot.value = listToText(state.menus["졍스팟"]);
      if (typeof els.editorDialog.showModal === "function") {
        els.editorDialog.showModal();
      } else {
        showToast("이 브라우저는 편집 창을 지원하지 않아요");
      }
    }

    function saveEditor() {
      state.menus["밥"] = textToList(els.editRice.value, "밥");
      state.menus["고기"] = textToList(els.editMeat.value, "고기");
      state.menus["국물"] = textToList(els.editSoup.value, "국물");
      state.menus["졍스팟"] = textToList(els.editSpot.value, "졍스팟");
      saveMenusToStorage();
      updateMenuCount();
      showToast("저장했어요");
    }

    function resetMenus() {
      state.menus = cloneMenus(DEFAULT_MENUS);
      saveMenusToStorage();
      els.editRice.value = listToText(state.menus["밥"]);
      els.editMeat.value = listToText(state.menus["고기"]);
      els.editSoup.value = listToText(state.menus["국물"]);
      els.editSpot.value = listToText(state.menus["졍스팟"]);
      updateMenuCount();
      showToast("기본 메뉴로 바꿨어요");
    }

    function attachEvents() {
      $$(".category-button").forEach((button) => {
        button.addEventListener("click", () => spin(button.dataset.category));
      });
      els.spinAgain.addEventListener("click", () => spin(state.currentCategory || "랜덤"));
      els.copyResult.addEventListener("click", copyResult);
      els.openEditor.addEventListener("click", openEditor);
      els.saveMenus.addEventListener("click", saveEditor);
      els.resetMenus.addEventListener("click", resetMenus);
      document.addEventListener("keydown", (event) => {
        if (event.repeat || state.spinning || els.editorDialog.open) return;
        const map = {
          "1": "밥",
          "2": "고기",
          "3": "국물",
          "4": "랜덤",
          "5": "졍스팟",
          "Enter": state.currentCategory || "랜덤",
          " ": state.currentCategory || "랜덤"
        };
        if (map[event.key]) {
          event.preventDefault();
          spin(map[event.key]);
        }
      });
    }

    function registerServiceWorker() {
      if (!("serviceWorker" in navigator)) return;
      if (location.protocol !== "https:" && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") return;
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }

    function init() {
      attachEvents();
      clearStoredHistory();
      renderHistory();
      renderResult("밥", { ...state.menus["밥"][0], category: "밥", index: 0 }, "오늘 저녁");
      registerServiceWorker();
    }

    init();
  </script>
</body>
</html>
